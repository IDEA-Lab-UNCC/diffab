name: diffab
channels:
  - pytorch
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.8
  - pytorch=1.12.1
  - torchvision=0.13.1
  - cudatoolkit=11.3.1
  - joblib
  - python-lmdb
  - tqdm
  - easydict
  - pyyaml
  - tensorboard
  - biopython=1.78
  - abnumber=0.3.0
  - mmseqs2
  - pdbfixer
  - pip
  - pip:
      # ESMFold2 (CZI Biohub, MIT) -- the folding backend for
      # `diffab.tools.eval.ipsae`. Needs a recent PyTorch, so it does NOT work
      # under the torch=1.12.1 pinned above; this file records intent and is
      # already stale (the working environment is python 3.13, not 3.8).
      # Install it into that environment directly:
      #     pip install esm
      - esm
      # Imported by the eval modules but never declared here historically.
      - ray
      - pandas
